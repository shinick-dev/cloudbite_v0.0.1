# Manual Cloudbite production deploy through the standard guard (`npm run deploy`).
# Started by hand from the Actions tab on main only; no push or schedule trigger.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, configured by an operator.
# Docs: docs/cloudbite/deployment.md
name: Cloudbite production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbite-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured; nothing was deployed."; missing=1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not configured; nothing was deployed."; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # Full history: the guard checks that origin/main is an ancestor of the deployed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - run: npm ci

      - name: Guarded deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
