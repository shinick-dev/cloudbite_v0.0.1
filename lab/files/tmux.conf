# 공유 터미널: 참가자와 강사가 같은 tmux 세션(share)에 붙어 같은 화면을 보고 둘 다 입력할 수 있다.
# 마우스는 끔 — 켜면 브라우저 드래그 복사가 안 된다.
set -g mouse off
set -g history-limit 20000
set -g default-terminal "xterm-256color"
set -g status-style "bg=colour130,fg=white"
set -g status-left " SHARED - instructor can see this "
set -g status-left-length 40
set -g status-right "#{session_attached} viewer(s) "
